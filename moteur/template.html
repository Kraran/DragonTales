<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>DragonTales</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --nuit:#1d1626; --nuit2:#2a2035; --nuit3:#372a44; --trait:#57466a;
  --sable:#ecd9b0; --os:#f8f0df; --sourd:#a8977f;
  --turquoise:#45c2b6; --souci:#eaa93b; --mesa:#b0553c;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,"URW Palladio L",Georgia,serif;
  --sans:"Gill Sans","Gill Sans MT","Segoe UI",Candara,"Trebuchet MS",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#0e0a13;overflow:hidden}
body{font-family:var(--sans);color:var(--sable)}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:var(--nuit);
  display:grid;grid-template-columns:1196px 652px;grid-template-rows:396px 1fr 64px;gap:16px 24px;padding:24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.w:focus-visible{outline:2px solid var(--turquoise);outline-offset:2px}

/* décor */
#scene{grid-column:1;grid-row:1;position:relative;border-radius:6px;overflow:hidden;background:#000}
#scene svg{position:absolute;inset:0;width:100%;height:100%}
#sceneTitle{position:absolute;left:36px;bottom:26px;right:36px;font:italic 400 58px/1.05 var(--serif);color:var(--os);text-shadow:0 2px 18px rgba(20,10,30,.75)}
#toClassic{position:absolute;right:14px;top:12px;background:rgba(29,22,38,.72);border:1px solid rgba(248,240,223,.35);border-radius:4px;padding:5px 14px;font-size:15px;color:var(--os)}
#toClassic:hover{background:rgba(29,22,38,.95);border-color:var(--os)}
#classic{position:absolute;inset:0;background:#000;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
#classic[hidden]{display:none}
@font-face{font-family:"Dragon6847";src:url("@@FONT@@") format("truetype")}
#cBezel{background:#000;padding:44px 64px;border:1px solid #1c1c1c;border-radius:10px}
#cScreen{margin:0;background:#44c532;color:#062606;width:1024px;height:768px;font:40px/1.2 "Dragon6847","Courier New",monospace;white-space:pre-wrap;overflow-wrap:anywhere;overflow-y:auto;padding:0;scrollbar-width:none;-webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed}
#cScreen::-webkit-scrollbar{display:none}
#cScreen .cursor{background:#1c30ff;animation:cblink 1s steps(1) infinite}
@keyframes cblink{50%{background:transparent}}
#cBar{display:flex;gap:12px}
#cBar button{background:#1c1c1c;color:#bbb;border:1px solid #444;border-radius:4px;padding:8px 20px;font:17px var(--sans)}
#cBar button:hover{background:#2a2a2a;color:#fff}

/* récit */
#log{grid-column:1;grid-row:2;overflow-y:auto;padding:6px 26px 6px 36px;font:25px/1.5 var(--serif);color:var(--sable);scrollbar-width:thin;scrollbar-color:var(--trait) transparent}
#log .turn{margin:0 0 18px;max-width:1080px}
#log .turn.old{opacity:.62}
#log .cmd{font:italic 22px var(--serif);color:var(--turquoise);margin:0 0 4px}
#log .cmd::before{content:"› "}
#log h3{font:600 17px var(--sans);letter-spacing:.04em;color:var(--souci);margin:22px 0 4px}
#log p{margin:0 0 10px}
#log .note{font:italic 20px var(--serif);color:var(--sourd)}
.w{cursor:pointer;border-bottom:1px dotted rgba(69,194,182,.7);border-radius:2px}
.w:hover{background:rgba(69,194,182,.22);color:var(--os)}

/* saisie */
#cmd{grid-column:1;grid-row:3;display:flex;align-items:center;gap:14px;background:var(--nuit2);border-radius:6px;padding:0 14px 0 26px;border:1px solid var(--trait)}
#armed{font:italic 24px var(--serif);color:var(--souci);white-space:nowrap}
#in{flex:1;background:none;border:0;outline:0;font:24px var(--serif);color:var(--os);min-width:0}
#in::placeholder{color:#7d6d8b;font-style:italic}
#cancel{background:none;border:1px solid var(--trait);border-radius:4px;padding:6px 14px;font-size:17px;color:var(--sourd)}
#cancel[hidden]{display:none}

/* colonne de droite */
#side{grid-column:2;grid-row:1 / span 3;display:grid;grid-template-rows:392px 196px 76px 252px 1fr;gap:14px;min-height:0}
#map{position:relative;background:var(--nuit2);border-radius:6px;overflow:hidden}
#mapView{position:absolute;inset:0}
#mapView svg.links,#bigInner svg.links{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
svg.links.top{pointer-events:none;z-index:2}
#mapLabel{position:absolute;left:0;top:0;right:0;padding:9px 110px 16px 14px;font:16px var(--sans);color:var(--os);pointer-events:none;background:linear-gradient(rgba(42,32,53,.96) 55%,rgba(42,32,53,0))}
#mapBig{position:absolute;right:10px;top:8px;background:var(--nuit3);border:1px solid var(--trait);border-radius:4px;padding:3px 12px;font-size:15px;color:var(--sable)}
#mapBig:hover{color:var(--os);border-color:var(--sable)}
.mc{position:absolute;cursor:pointer;border-radius:5px;outline:2px solid rgba(29,22,38,.9)}
.mc{background:var(--nuit2);overflow:hidden}
.mc .th{position:absolute;left:0;top:0;right:0;overflow:hidden}
.mc .th svg{width:100%;height:100%;display:block}
.mc:hover{outline:2px solid var(--os)}
.mc.cur{outline:4px solid var(--turquoise);box-shadow:0 0 0 7px rgba(69,194,182,.25)}
.mc .ic{position:absolute;left:3px;display:flex;gap:2px;align-items:center;background:rgba(248,240,223,.9);border-radius:4px;padding:1px 3px}
.mc .ic span{font:600 12px var(--sans);color:var(--nuit)}
.mc .oi{display:block}
.mc .ud{position:absolute;right:4px;top:2px;font:13px var(--sans);color:var(--os);text-shadow:0 0 4px #000,0 0 2px #000}
.mc .dr{position:absolute;left:3px;top:3px;font:600 11px var(--sans);color:var(--nuit);background:var(--turquoise);border-radius:999px;padding:0 6px}
.mc .lb{position:absolute;left:0;right:0;padding:4px 6px 0;text-align:center;line-height:1.15;background:var(--nuit3);display:flex;flex-direction:column;justify-content:center}
.mc .lb b{display:block;font:600 12.5px/1.15 var(--sans);color:var(--os);overflow:hidden;max-height:30px}
.mc .lb span{display:block;font:italic 13px var(--serif);color:var(--souci);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkLabel{font:italic 15px var(--serif);fill:#9fe3da;paint-order:stroke;stroke:#1d1626;stroke-width:5px}
#bigmap{position:absolute;inset:0;background:var(--nuit);z-index:4;display:grid;grid-template-rows:auto 1fr}
#bigmap[hidden]{display:none}
#bigHead{display:flex;align-items:baseline;gap:24px;padding:18px 40px 12px}
#bigTitle{font:italic 38px var(--serif);color:var(--os);white-space:nowrap}
#bigHint{flex:1;font:16px/1.35 var(--sans);color:var(--sourd)}
#bigClose{background:var(--souci);border:0;border-radius:4px;padding:10px 26px;font-size:19px;font-weight:600;color:var(--nuit)}
#bigScroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--trait) transparent}
#bigInner{position:relative}
#mid{display:grid;grid-template-columns:196px 1fr;gap:14px;min-height:0}
#compass{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;background:var(--nuit2);border-radius:6px;padding:10px}
#compass button{background:var(--nuit3);border:1px solid var(--trait);border-radius:4px;font-size:17px;padding:0}
#compass button.off{opacity:.32}
#compass button:hover{background:var(--turquoise);color:var(--nuit);border-color:var(--turquoise);opacity:1}
#lists{display:grid;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
.box{background:var(--nuit2);border-radius:6px;padding:8px 12px;overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--trait) transparent}
.box h2{font:600 15px var(--sans);color:var(--sourd);margin:0 0 6px;display:inline-block;margin-right:10px}
.chips{display:inline}
.chip{display:inline-block;background:var(--nuit3);border:1px solid var(--trait);border-radius:999px;padding:3px 13px;margin:0 6px 6px 0;font:18px var(--serif);color:var(--os)}
.chip:hover{border-color:var(--turquoise);background:rgba(69,194,182,.2)}
.chip.lexi{font-size:16px;padding:2px 11px;color:var(--sable);background:none}
.coin{background:none;border:0;padding:0;margin:0 4px 0 0;vertical-align:middle;border-radius:50%;line-height:0;filter:drop-shadow(0 0 5px rgba(234,169,59,.55))}
.coin:hover{filter:drop-shadow(0 0 9px rgba(255,243,196,.95));transform:translateY(-2px)}
#log .turn.hint{border-left:3px solid var(--souci);padding-left:18px}
#log .hintText{color:#fbe3a4;font-style:italic}
.empty{font:italic 17px var(--serif);color:#7d6d8b}
#verbs{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:8px}
#verbs button{background:var(--nuit2);border:1px solid var(--trait);border-radius:4px;font-size:18px;padding:0 4px;color:var(--sable)}
#verbs button.sorc{border-color:rgba(69,194,182,.55);color:#9fe3da}
#verbs button:hover{background:var(--nuit3);color:var(--os)}
#verbs button.on{background:var(--souci);border-color:var(--souci);color:var(--nuit);font-weight:600}
#tools{display:flex;gap:8px;align-items:stretch}
#tools button{flex:1;background:none;border:1px solid var(--trait);border-radius:4px;font-size:16px;color:var(--sourd);padding:0 4px}
#tools button:hover{color:var(--os);border-color:var(--sable)}
#tools button:disabled{opacity:.35;cursor:default}

/* fenêtres */
#overlay{position:absolute;inset:0;background:rgba(14,10,19,.82);display:flex;align-items:center;justify-content:center;z-index:7}
#overlay.bye{background:#000}
#overlay.bye .card{background:none;border:0}
#overlay[hidden]{display:none}
#overlay.title{background:#0e0a13 var(--cover) center/cover no-repeat;justify-content:flex-end;align-items:stretch}
#overlay.title::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,10,19,0) 52%,rgba(14,10,19,.74) 70%,rgba(14,10,19,.9) 100%)}
.title .intro{position:relative;width:640px;margin-right:56px;display:flex;flex-direction:column;justify-content:center;text-align:left;padding:0;min-width:0;max-width:none}
.title .intro p{font:22px/1.5 var(--serif);color:var(--os);margin:0 0 16px;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.title .intro p.verse{font-style:italic;color:#fbe3a4;padding-left:22px;border-left:3px solid var(--souci);margin:6px 0 22px}
.title .intro p.credit{font:16px/1.4 var(--sans);color:var(--sable);opacity:.85;margin-top:18px}
.title .intro .row{justify-content:flex-start;margin-top:14px}
.title .intro button{background:rgba(29,22,38,.82)}
.title .intro button.main{background:var(--souci)}
.card{background:var(--nuit2);border:1px solid var(--trait);border-radius:8px;padding:44px 56px;max-width:980px;min-width:560px;text-align:center}
.title .card{background:none;border:0}
.card h1{font:italic 400 112px/1 var(--serif);color:var(--os);margin:0 0 14px}
.card h2{font:italic 400 54px/1.1 var(--serif);color:var(--os);margin:0 0 18px}
.card p{font:25px/1.5 var(--serif);color:var(--sable);margin:0 0 16px}
.card p.small{font:19px/1.5 var(--sans);color:var(--sourd)}
.card .row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.card button{background:var(--nuit3);border:1px solid var(--trait);border-radius:4px;padding:13px 26px;font-size:21px;color:var(--os)}
.card button.main{background:var(--souci);border-color:var(--souci);color:var(--nuit);font-weight:600}
.card button:hover{border-color:var(--os)}
.card button:disabled{opacity:.35;cursor:default}
.card.opts{min-width:780px;text-align:left;padding:30px 52px}
.card.opts p.small{margin:0 0 4px;font-size:17px}
.card.opts h2{text-align:center}
.optRow{display:grid;grid-template-columns:1fr auto auto;gap:18px;align-items:center;margin:14px 0 4px;font:24px var(--serif);color:var(--os)}
.optRow button{padding:8px 22px;font-size:19px;min-width:150px}
.optRow input[type=range]{width:300px;accent-color:var(--souci)}
.optRow b{font:600 19px var(--sans);color:var(--sable);min-width:64px;text-align:right}
.slots{display:grid;gap:10px;margin-top:10px;text-align:left}
.slot{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--nuit);border-radius:4px;padding:10px 12px 10px 18px}
.slot span{font:21px var(--serif)} .slot small{display:block;font:15px var(--sans);color:var(--sourd)}
.slot button{padding:8px 16px;font-size:17px}
/* étagère DragonTales */
#shelf{position:absolute;inset:0;z-index:6;background:#000;display:grid;grid-template-columns:1fr 600px;grid-template-rows:auto 1fr auto;gap:0 72px;padding:64px 96px 56px}
#shelf[hidden]{display:none}
.shHead{grid-column:1/3;display:flex;align-items:baseline;gap:40px;padding-bottom:40px}
.shHead h1{margin:0;font-size:104px;line-height:1;white-space:nowrap}
#shelf button.shTitle{all:unset;cursor:pointer;display:inline-block;border-radius:8px}
#shelf button.shTitle:hover .shTales{color:#fff}
#shelf button.shTitle:focus-visible{outline:2px solid var(--turquoise);outline-offset:8px}
.shDragon{font-family:var(--sans);font-weight:800;letter-spacing:-3px;background:linear-gradient(90deg,#e5231b 0%,#f47b20 22%,#ffd400 45%,#3aa935 68%,#1c8fd6 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.shTales{font-family:var(--serif);font-style:italic;font-weight:400;color:var(--os);margin-left:6px}
.shTag{margin:0;font:24px/1.3 var(--serif);color:var(--sourd)}
.shRow{grid-column:1;grid-row:2;display:flex;gap:44px;align-items:flex-end;overflow-x:auto;padding:8px 8px 0;border-bottom:3px solid #2b2b2b}
.shBox{flex:none;width:452px;height:627px;padding:0;border:0;background:#000;border-radius:10px;position:relative;margin-bottom:22px;opacity:.55}
.shBox img{display:block;width:100%;height:100%;object-fit:cover;border-radius:10px}
.shBox.on{opacity:1;outline:3px solid var(--souci);outline-offset:5px}
.shBox:hover{opacity:1}
.shEmpty{border:2px dashed #3a3a3a;display:flex;align-items:center;justify-content:center;padding:48px;opacity:1}
.shEmpty span{font:italic 24px/1.4 var(--serif);color:#6f6f6f;text-align:center;text-wrap:balance}
.shInfo{grid-column:2;grid-row:2;align-self:end;padding-bottom:22px}
.shInfo h2{font:italic 400 76px/1 var(--serif);color:var(--os);margin:0 0 14px}
.shInfo p{margin:0 0 18px}
.shMeta{font:21px/1.4 var(--sans);color:var(--souci)}
.shBlurb{font:26px/1.5 var(--serif);color:var(--sable)}
.shState{font:19px/1.4 var(--sans);color:var(--sourd)}
.shInfo .row{display:flex;margin-top:30px}
#shelf button:not(.shBox):not(.shTitle){background:#1a1a1a;border:1px solid #444;border-radius:4px;padding:13px 26px;font-size:21px;color:var(--os)}
#shelf button:not(.shBox):not(.shTitle):hover{border-color:var(--os)}
#shelf button.main{background:var(--souci);border-color:var(--souci);color:var(--nuit);font-weight:600;padding:18px 64px;font-size:26px}
.shFoot{grid-column:1/3;grid-row:3;display:flex;justify-content:flex-end;align-items:center;gap:14px;padding-top:28px}
.shVer{margin-right:auto;font:17px var(--sans);color:#6f6f6f}
/* à propos */
.about .card{padding:0;width:1080px;max-width:none;text-align:left;overflow:hidden;background:#141414;border-color:#3a3a3a}
.abHead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 18px 32px;border-bottom:1px solid #3a3a3a}
.abHead h3{margin:0;font:600 24px var(--sans);color:var(--os)}
.card button.abX{padding:2px 16px;font-size:30px;line-height:1.2;background:none;border-color:transparent;color:var(--sourd)}
.card button.abX:hover{color:var(--os);border-color:#444}
.abLayout{display:grid;grid-template-columns:330px minmax(0,1fr)}
.abPortrait{position:relative;display:block;overflow:hidden;background:#000}
.abPortrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.abFade{position:absolute;inset:0;background:linear-gradient(to right,transparent 60%,#141414)}
.abPortrait:hover img{filter:brightness(1.15)}
.abPortrait:focus-visible{outline:2px solid var(--turquoise);outline-offset:-4px}
.abMain{padding:32px 36px 30px 28px;display:grid;gap:20px}
.abHero{display:flex;align-items:baseline;gap:18px}
.abHero h2{margin:0;font-size:58px;line-height:1;white-space:nowrap}
.abHero h2 .shDragon{letter-spacing:-2px}
.abVer{font:21px var(--sans);color:var(--sourd)}
.card p.abDesc{margin:0;font:22px/1.5 var(--serif);color:var(--sable)}
.abGrid{display:grid;grid-template-columns:auto 1fr;gap:8px 28px;margin:0;font:19px/1.4 var(--sans)}
.abGrid dt{color:var(--sourd)} .abGrid dd{margin:0;color:var(--os);overflow-wrap:anywhere}
.about a{color:var(--souci);text-decoration:none} .about a:hover{text-decoration:underline}
.card p.abNote{margin:0;padding:14px 18px;border-radius:4px;background:#1f1f1f;font:17px/1.5 var(--sans);color:var(--sourd)}
.abFoot{display:flex;justify-content:flex-end;gap:14px;padding:18px 32px;border-top:1px solid #3a3a3a}
.about .card button:not(.main):not(.abX){background:#1a1a1a;border-color:#444}
.help{text-align:left}
.help p{font-size:22px}
@media (prefers-reduced-motion:no-preference){ #log .turn:last-child{animation:fade .35s ease-out} @keyframes fade{from{opacity:0}to{opacity:1}} }
</style>
</head>
<body>
<div id="stage">
  <section id="scene"><div id="sceneArt"></div><button type="button" id="toClassic"></button><div id="sceneTitle"></div></section>
  <section id="log" aria-live="polite"></section>
  <form id="cmd" autocomplete="off"><span id="armed"></span><input id="in" spellcheck="false" autocomplete="off"><button type="button" id="cancel" hidden></button></form>
  <aside id="side">
    <div id="map"><div id="mapView"></div><div id="mapLabel"></div><button type="button" id="mapBig"></button></div>
    <div id="mid">
      <div id="compass"></div>
      <div id="lists">
        <div class="box" id="here"></div>
        <div class="box" id="inv"></div>
      </div>
    </div>
    <div class="box" id="lex"></div>
    <div id="verbs"></div>
    <div id="tools"></div>
  </aside>
  <div id="bigmap" hidden><div id="bigHead"><span id="bigTitle"></span><span id="bigHint"></span><button type="button" id="bigClose"></button></div><div id="bigScroll"><div id="bigInner"></div></div></div>
  <div id="classic" hidden><div id="cBezel"><pre id="cScreen"></pre></div><div id="cBar"><button type="button" id="cModern"></button><button type="button" id="cLang"></button><button type="button" id="cFull"></button><button type="button" id="cQuit"></button></div></div>
  <div id="shelf" hidden></div>
  <div id="overlay" hidden></div>
</div>
<script>
// registre des aventures : chaque dossier de aventures/ s'y inscrit
window.DragonTales={version:"@@VERSION@@",date:"@@DATE@@",portrait:"@@AUTEUR@@",adventures:[],register(a){ this.adventures.push(a); }};
</script>
<script>
@@CPU@@
</script>
<script>
@@MACHINE@@
</script>
<script>
@@SFX@@
</script>
@@AVENTURES@@
<script>
@@MOTEUR@@
</script>
</body>
</html>
