# Assemble DragonTales.html et prépare la version GitHub en brouillon, avec DragonTales-X.Y.Z.zip (la page et Jouer.bat).
# Se lance à la main (onglet Actions > Version > Run workflow) ou quand on pousse une étiquette vX.Y.Z.
# Le numéro vient du fichier VERSION ; les notes de docs/versions/vX.Y.Z.md. L'étiquette est créée à la publication.
name: Version
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Vérifier que l'étiquette correspond au fichier VERSION
        if: github.ref_type == 'tag'
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - name: Assembler la page
        run: python build.py
      - name: Préparer l'archive
        run: |
          V="$(cat VERSION)"
          mkdir "DragonTales-$V"
          cp DragonTales.html Jouer.bat "DragonTales-$V/"
          zip -r "DragonTales-$V.zip" "DragonTales-$V"
      - name: Créer la version en brouillon
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          # Publier un brouillon crée son étiquette, ce qui relance ce flux : ne rien refaire si la version existe déjà.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then echo "La version $TAG est déjà publiée."; exit 0; fi
          NOTES="docs/versions/$TAG.md"
          if [ -f "$NOTES" ]; then set -- --notes-file "$NOTES"; else set -- --generate-notes; fi
          gh release create "$TAG" "DragonTales-$(cat VERSION).zip" --draft --target "$GITHUB_SHA" --title "DragonTales $(cat VERSION)" "$@"
